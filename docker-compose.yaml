services:
  app:
    image: tintenfisch
    build:
      dockerfile_inline: |
        FROM node:24-bookworm-slim AS build
        RUN apt-get update \
         && apt-get install -y --no-install-recommends build-essential ca-certificates curl \
         && rm -rf /var/lib/apt/lists/*
        RUN curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --target wasm32-unknown-unknown
        ENV PATH=/root/.cargo/bin:$$PATH
        RUN corepack enable
        WORKDIR /app
        COPY package.json pnpm-lock.yaml pnpm-workspace.yaml ./
        RUN corepack install && pnpm install --frozen-lockfile
        COPY engine/Cargo.toml engine/Cargo.lock engine/rustfmt.toml engine/
        COPY engine/.cargo engine/.cargo
        COPY engine/core engine/core
        COPY engine/wasm/Cargo.toml engine/wasm/
        COPY engine/wasm/src engine/wasm/src
        COPY index.html vite.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json ./
        COPY scripts scripts
        COPY src src
        COPY public public
        RUN VITE_SITE_URL=__VITE_SITE_URL__ pnpm build

        FROM nginx:1.29-alpine
        COPY --from=build /app/dist /usr/share/nginx/html
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf

configs:
  nginx:
    content: |
      server {
          listen 80;
          root /usr/share/nginx/html;

          gzip on;
          gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

          sub_filter_once off;
          sub_filter '__VITE_SITE_URL__' '${VITE_SITE_URL:-https://tintenfisch.app}';

          location /assets/ {
              add_header Cache-Control "public, max-age=31536000, immutable";
              try_files $$uri =404;
          }

          location / {
              add_header Cache-Control "no-cache";
              try_files $$uri /index.html;
          }
      }
