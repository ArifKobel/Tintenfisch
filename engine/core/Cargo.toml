[package]
name = "tintenfisch"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.9"
cbc = { version = "0.2", features = ["block-padding"] }
cms = { version = "0.3.0-rc.0", default-features = false }
der = { version = "0.8", features = ["derive", "oid", "alloc"] }
des = "0.9"
flate2 = "1"
hmac = "0.13"
md-5 = "0.11"
pkcs8 = { version = "0.11", features = ["encryption"] }
rc2 = "0.9"
rsa = { version = "0.10.0-rc.19", default-features = false, features = ["encoding", "sha2"] }
sha1 = { version = "0.11", features = ["oid"] }
sha2 = "0.11"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ttf-parser = "0.25"
x509-cert = { version = "0.3", default-features = false }
zune-jpeg = "0.4"

[dev-dependencies]
tiny-skia = { version = "0.11", features = ["png-format"] }
